# A tag vX.Y.Z releases that version: the tag must match package.json, CI must pass, then the image is built,
# smoke-tested and pushed to GHCR (X.Y.Z, X.Y, X, latest) and to Halvic's Harbor (X.Y.Z only, immutable; the
# halviclabs cluster pulls from there), and a GitHub Release is created with the CHANGELOG section for the version.
# Secrets: HARBOR_USERNAME and HARBOR_PASSWORD of a robot account limited to the Harbor project alvireq.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected="$(node -p "require('./package.json').version")"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $expected."
            exit 1
          fi
          server="$(sed -n 's/^export const SERVER_VERSION = "\(.*\)";$/\1/p' src/server.ts)"
          if [ "$version" != "$server" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match SERVER_VERSION $server in src/server.ts."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  checks:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  ghcr:
    name: GHCR
    needs: [version, checks]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: ghcr.io/halviclabs/invoiceninja-mcp
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      mode: release
      ref: ${{ github.ref_name }}
      version: ${{ needs.version.outputs.version }}
      smoke-command: |
        docker run -d --network none --name "$SMOKE_NAME" \
          -e INVOICE_NINJA_URL=http://127.0.0.1:9 \
          -e INVOICE_NINJA_TOKEN=ci \
          -e INVOICE_NINJA_ALLOW_WRITES=true \
          -e MCP_BEARER_TOKEN=ci-token \
          "$SMOKE_IMAGE"
        docker run --rm -i --network "container:$SMOKE_NAME" node:24-alpine \
          node --input-type=module - http://127.0.0.1:8787/mcp --bearer ci-token --wait 60 \
          < "$SMOKE_TOOLS/scripts/ci/mcp-smoke.mjs"

  harbor:
    name: Harbor
    needs: [version, checks]
    uses: ./.github/workflows/image.yml
    with:
      image: harbor.halviclabs.ch/alvireq/invoiceninja-mcp
      registry: harbor.halviclabs.ch
      mode: release
      ref: ${{ github.ref_name }}
      version: ${{ needs.version.outputs.version }}
      floating: false
      smoke-command: |
        docker run -d --network none --name "$SMOKE_NAME" \
          -e INVOICE_NINJA_URL=http://127.0.0.1:9 \
          -e INVOICE_NINJA_TOKEN=ci \
          -e INVOICE_NINJA_ALLOW_WRITES=true \
          -e MCP_BEARER_TOKEN=ci-token \
          "$SMOKE_IMAGE"
        docker run --rm -i --network "container:$SMOKE_NAME" node:24-alpine \
          node --input-type=module - http://127.0.0.1:8787/mcp --bearer ci-token --wait 60 \
          < "$SMOKE_TOOLS/scripts/ci/mcp-smoke.mjs"
    secrets:
      registry-username: ${{ secrets.HARBOR_USERNAME }}
      registry-password: ${{ secrets.HARBOR_PASSWORD }}

  release:
    name: GitHub Release
    needs: [version, ghcr, harbor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_TAGS: ${{ needs.ghcr.outputs.tags }}
          GHCR_DIGEST: ${{ needs.ghcr.outputs.digest }}
          HARBOR_TAGS: ${{ needs.harbor.outputs.tags }}
          HARBOR_DIGEST: ${{ needs.harbor.outputs.digest }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            /^## \[/ { printing = ($0 ~ "^## \\[" v "\\]") ; next }
            printing { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          {
            echo
            echo "## Images"
            echo
            echo "GHCR (digest \`$GHCR_DIGEST\`):"
            echo
            printf '%s\n' "$GHCR_TAGS" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Harbor (digest \`$HARBOR_DIGEST\`):"
            echo
            printf '%s\n' "$HARBOR_TAGS" | sed 's/^/- `/; s/$/`/'
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "v$VERSION" --notes-file notes.md --verify-tag)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
